<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Opción C — Trayecto Inteligente</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; background:#000; color:#fff; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; overflow:hidden; }
  .app { height:100%; display:flex; flex-direction:column; }

  /* ---------- Cabecera ---------- */
  header {
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px; border-bottom:1px solid #222; gap:10px; flex-wrap:wrap;
  }
  header .brand { font-weight:700; letter-spacing:1px; }
  header .clock { font-variant-numeric: tabular-nums; background:#111; border:1px solid #333; padding:6px 12px; border-radius:20px; font-weight:700; font-size:13px; color:#bbb; }

  /* ---------- Vista selector ---------- */
  #selectorView { flex:1; display:flex; flex-direction:column; overflow:auto; padding:14px; gap:14px; }
  .section-title { font-size:13px; color:#888; text-transform:uppercase; letter-spacing:1.5px; }
  .time-options { display:flex; gap:8px; flex-wrap:wrap; }
  .time-options button {
    background:#111; color:#fff; border:1px solid #333; border-radius:12px;
    padding:12px 20px; font-size:15px; font-weight:700; cursor:pointer;
    font-variant-numeric: tabular-nums;
  }
  .time-options button.on { background:#fff; color:#000; border-color:#fff; }
  .time-options button:active { transform:scale(.97); }

  .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; }
  .card {
    background:#0d0d0d; border:1px solid #2a2a2a; border-radius:14px;
    padding:14px; cursor:pointer; display:flex; flex-direction:column; gap:8px;
    position:relative; overflow:hidden; transition:border-color .2s, transform .1s;
  }
  .card:hover { border-color:#555; }
  .card:active { transform:scale(.98); }
  .card .card-title { font-size:17px; font-weight:800; letter-spacing:.5px; }
  .card .card-desc { font-size:12px; color:#999; line-height:1.35; }
  .card .card-meta { display:flex; justify-content:space-between; font-size:11px; color:#aaa; margin-top:auto; }
  .card .dur { border:1px solid #444; border-radius:20px; padding:2px 8px; }
  .card .fits { color:#7CFC7C; border-color:#2a5a2a; }
  .card .nofit { color:#ff7070; border-color:#5a2a2a; opacity:.6; }
  .card.disabled { opacity:.35; pointer-events:none; filter:grayscale(1); }
  .card .preview { position:absolute; inset:0; opacity:.12; pointer-events:none; }

  .empty { color:#666; font-size:13px; text-align:center; padding:20px; border:1px dashed #333; border-radius:12px; }
  .hint { font-size:12px; color:#777; text-align:center; }

  /* ---------- Vista juego ---------- */
  #playView { flex:1; display:none; flex-direction:column; }
  #playView.active { display:flex; }
  .topbar {
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 12px; border-bottom:1px solid #222; gap:10px; flex-wrap:wrap;
  }
  .topbar .title { font-weight:700; }
  .timer { font-variant-numeric: tabular-nums; font-weight:700; font-size:18px; }
  .timer.warn { color:#ff5555; animation:pulse .6s infinite alternate; }
  @keyframes pulse { from{opacity:1} to{opacity:.4} }
  .topbar button { background:#111; color:#fff; border:1px solid #333; border-radius:10px; padding:7px 11px; font-size:13px; cursor:pointer; }
  .stage { flex:1; display:flex; align-items:center; justify-content:center; padding:8px; overflow:hidden; }
  .stage canvas { background:#000; border:1px solid #222; image-rendering:pixelated; touch-action:none; max-width:100%; max-height:100%; }

  /* ---------- Overlay ---------- */
  #overlay {
    position:fixed; inset:0; background:rgba(0,0,0,.88); z-index:50;
    display:none; align-items:center; justify-content:center; flex-direction:column; gap:14px; text-align:center; padding:24px;
  }
  #overlay.show { display:flex; }
  #overlay h3 { font-size:26px; margin:0; }
  #overlay p { color:#bbb; margin:0; }
  #overlay button { background:#fff; color:#000; border:none; border-radius:12px; padding:12px 22px; font-size:16px; font-weight:700; cursor:pointer; }

  /* ---------- Sopa ---------- */
  .sopa-wrap { width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; overflow:auto; }
  .sopa-wrap .grid-container { display:grid; grid-template-columns:repeat(12,1fr); gap:2px; width:min(92vw,440px); }
  .sopa-wrap .cell { aspect-ratio:1; display:flex; align-items:center; justify-content:center; background:#1a1a1a; border:1px solid #333; border-radius:3px; font-weight:700; font-size:clamp(9px,2.2vw,15px); cursor:pointer; }
  .sopa-wrap .cell.selected { background:#444; }
  .sopa-wrap .cell.found-word { background:#00ff00; color:#000; }
  .sopa-wrap .word-list { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin:8px 0; max-height:60px; overflow:auto; }
  .sopa-wrap .word-item { font-size:12px; padding:3px 8px; border:1px solid #444; border-radius:5px; }
  .sopa-wrap .word-item.found { background:#00ff00; color:#000; text-decoration:line-through; }
  .sopa-wrap .stats { font-size:13px; padding:4px; }
</style>
</head>
<body>
<div class="app">

  <!-- ================= CABECERA ================= -->
  <header>
    <div class="brand">🧭 TRAYECTO INTELIGENTE</div>
    <div class="clock" id="clock">— s</div>
  </header>

  <!-- ================= SELECTOR ================= -->
  <div id="selectorView">
    <div>
      <div class="section-title">¿Cuánto tiempo tienes?</div>
      <div class="time-options" id="timeOptions">
        <button data-t="30">30 s</button>
        <button data-t="60">60 s</button>
        <button data-t="90">90 s</button>
        <button data-t="120" class="on">120 s</button>
      </div>
    </div>

    <div>
      <div class="section-title">Juegos que caben en tu tiempo</div>
      <div class="cards" id="cards"></div>
    </div>

    <div class="hint">Elige un juego para empezar. Al terminar la ronda volverás aquí.</div>
  </div>

  <!-- ================= VISTA JUEGO ================= -->
  <div id="playView">
    <div class="topbar">
      <button id="btnBack">← Cambiar juego</button>
      <div class="title" id="playTitle">Juego</div>
      <div class="timer" id="timer">02:00</div>
    </div>
    <div class="stage" id="stage"></div>
  </div>
</div>

<!-- Overlay fin de ronda -->
<div id="overlay">
  <h3 id="ovTitle">¡Ronda terminada!</h3>
  <p id="ovMsg">Volviendo al selector…</p>
  <button id="ovBtn">Volver ahora</button>
</div>

<script>
(() => {
  const MAX_SECONDS = 120;
  const $ = (s) => document.querySelector(s);
  const randInt = (a,b) => (Math.random()*(b-a+1)+a)|0;
  const fmtTime = (sec) => {
    sec = Math.max(0, sec|0);
    return String((sec/60)|0).padStart(2,'0') + ':' + String(sec%60).padStart(2,'0');
  };

  // ---------- Estado ----------
  let availableTime = 120;
  let current = null;
  let timerId = null;
  let remaining = MAX_SECONDS;
  let paused = false;

  // ---------- Catálogo de juegos ----------
  const CATALOG = [
    { id:'sopa',   title:'Sopa de Letras', desc:'Encuentra palabras ocultas en la rejilla.', min:30 },
    { id:'arcade', title:'Arcade',         desc:'Esquiva los círculos que caen.',          min:30 },
    { id:'tetris', title:'Tetris',         desc:'Encaja las piezas y limpia líneas.',      min:60 },
    { id:'race',   title:'F1',             desc:'Cambia de carril y esquiva autos.',        min:60 },
  ];

  // ---------- Referencias ----------
  const selectorView = $('#selectorView');
  const playView = $('#playView');
  const cardsEl = $('#cards');
  const timeOptions = $('#timeOptions');
  const clockEl = $('#clock');
  const stage = $('#stage');
  const timerEl = $('#timer');
  const playTitle = $('#playTitle');
  const overlay = $('#overlay');
  const ovTitle = $('#ovTitle');
  const ovMsg = $('#ovMsg');

  // =======================================================================
  // RENDER DEL SELECTOR
  // =======================================================================
  function renderCards() {
    cardsEl.innerHTML = '';
    let any = false;
    CATALOG.forEach(g => {
      const fits = g.min <= availableTime;
      if (fits) any = true;
      const card = document.createElement('div');
      card.className = 'card' + (fits ? '' : ' disabled');
      card.innerHTML = `
        <div class="card-title">${g.title}</div>
        <div class="card-desc">${g.desc}</div>
        <div class="card-meta">
          <span class="dur ${fits?'fits':'nofit'}">⏱ ${g.min} s mín.</span>
          <span>${fits?'▶ jugar':'no cabe'}</span>
        </div>
      `;
      if (fits) card.addEventListener('click', () => startGame(g.id));
      cardsEl.appendChild(card);
    });
    if (!any) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'No hay juegos que quepan en ese tiempo. Prueba con más segundos.';
      cardsEl.appendChild(empty);
    }
  }

  function setAvailableTime(t) {
    availableTime = t;
    clockEl.textContent = t + ' s';
    [...timeOptions.children].forEach(b => b.classList.toggle('on', parseInt(b.dataset.t) === t));
    renderCards();
  }

  [...timeOptions.children].forEach(b => {
    b.addEventListener('click', () => setAvailableTime(parseInt(b.dataset.t)));
  });

  // =======================================================================
  // JUEGOS EMBEBIDOS (mismos módulos que A y B)
  // =======================================================================
  function createSopa() {
    const GRID_SIZE = 12;
    const DEFAULT_WORDS = ['SOL','MAR','LUZ','PAN','PEZ','GATO','PERRO','CASA','ARBOL','FLOR','MESA','SILLA','PUERTA','VENTANA','CAMINO','RIO','MONTANA','PLAYA','CIELO','ESTRELLA','LUNA','NUBE','LLUVIA','VIENTO','FUEGO','AGUA','TIERRA','AIRE','VIDA','AMOR'];
    let grid=[], wordList=[], foundWords=[], selected=[], dragging=false;
    let wrap, gridEl, listEl, statsEl;
    const initGrid = () => grid = Array.from({length:GRID_SIZE},()=>Array.from({length:GRID_SIZE},()=>''));
    function canPlace(w,r,c,dr,dc){ for(let i=0;i<w.length;i++){const rr=r+dr*i,cc=c+dc*i;if(rr<0||rr>=GRID_SIZE||cc<0||cc>=GRID_SIZE)return false;if(grid[rr][cc]!==w[i]&&grid[rr][cc]!=='')return false;}return true;}
    function place(w,r,c,dr,dc){for(let i=0;i<w.length;i++)grid[r+dr*i][c+dc*i]=w[i];}
    function tryPlace(w){const dirs=[[0,1],[1,0],[1,1],[1,-1]];for(let a=0;a<300;a++){const [dr,dc]=dirs[randInt(0,3)];const r=randInt(0,GRID_SIZE-1),c=randInt(0,GRID_SIZE-1);if(canPlace(w,r,c,dr,dc)){place(w,r,c,dr,dc);return true;}}return false;}
    function build(){
      initGrid(); wordList=[];
      DEFAULT_WORDS.map(w=>w.toUpperCase()).sort((a,b)=>b.length-a.length).forEach(w=>{if(w.length<=GRID_SIZE&&tryPlace(w))wordList.push(w);});
      for(let r=0;r<GRID_SIZE;r++)for(let c=0;c<GRID_SIZE;c++)if(!grid[r][c])grid[r][c]=String.fromCharCode(65+randInt(0,25));
      foundWords=[]; selected=[]; render();
      attachGridListeners();
    }
    function attachGridListeners(){
      if (gridEl.dataset.listeners) return;
      gridEl.dataset.listeners = '1';
      gridEl.style.touchAction = 'none';

      gridEl.addEventListener('pointerdown', (e) => {
        const cell = e.target.closest('.cell');
        if (!cell) return;
        e.preventDefault();
        start(+cell.dataset.r, +cell.dataset.c);
      });

      gridEl.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        e.preventDefault();
        const el = document.elementFromPoint(e.clientX, e.clientY);
        const cell = el && el.closest ? el.closest('.cell') : null;
        if (!cell || !gridEl.contains(cell)) return;
        move(+cell.dataset.r, +cell.dataset.c);
      });

      const finish = (e) => {
        if (!dragging) return;
        e.preventDefault();
        end();
      };
      gridEl.addEventListener('pointerup', finish);
      gridEl.addEventListener('pointercancel', finish);
      gridEl.addEventListener('pointerleave', finish);
    }

    function render(){
      gridEl.innerHTML='';
      for(let r=0;r<GRID_SIZE;r++)for(let c=0;c<GRID_SIZE;c++){
        const cell=document.createElement('div');
        cell.className='cell'; cell.textContent=grid[r][c];
        cell.dataset.r=r; cell.dataset.c=c;
        gridEl.appendChild(cell);
      }
      listEl.innerHTML='';
      wordList.forEach(w=>{const s=document.createElement('span');s.className='word-item'+(foundWords.includes(w)?' found':'');s.textContent=w;listEl.appendChild(s);});
      statsEl.textContent=`${foundWords.length}/${wordList.length} encontradas`;
    }
    function start(r,c){dragging=true;selected=[{r,c}];paint();}
    function move(r,c){const last=selected[selected.length-1];const dr=Math.abs(r-last.r),dc=Math.abs(c-last.c);if(dr<=1&&dc<=1&&!(dr===0&&dc===0)){selected.push({r,c});paint();}}

    function end(){
      dragging=false;
      const word=selected.map(({r,c})=>grid[r][c]).join('');
      const rev=word.split('').reverse().join('');
      const hit=wordList.find(w=>!foundWords.includes(w)&&(w===word||w===rev));
      if(hit){
        foundWords.push(hit);
        selected.forEach(({r,c})=>{
          const el=gridEl.children[r*GRID_SIZE+c];
          if(el){ el.classList.add('found-word'); el.classList.remove('selected'); }
        });
        // Actualizar solo la lista de palabras y el contador, sin re-renderizar la rejilla
        listEl.innerHTML='';
        wordList.forEach(w=>{
          const s=document.createElement('span');
          s.className='word-item'+(foundWords.includes(w)?' found':'');
          s.textContent=w;
          listEl.appendChild(s);
        });
        statsEl.textContent=`${foundWords.length}/${wordList.length} encontradas`;
      } else {
        selected=[];
        paint();
      }
      selected=[];
    }

    function paint(){[...gridEl.children].forEach(el=>el.classList.remove('selected'));selected.forEach(({r,c})=>{const el=gridEl.children[r*GRID_SIZE+c];if(el&&!el.classList.contains('found-word'))el.classList.add('selected');});}
    return {
      id:'sopa', title:'Sopa de Letras',
      mount(container){
        container.innerHTML='';
        wrap=document.createElement('div'); wrap.className='sopa-wrap';
        listEl=document.createElement('div'); listEl.className='word-list';
        gridEl=document.createElement('div'); gridEl.className='grid-container';
        statsEl=document.createElement('div'); statsEl.className='stats';
        wrap.appendChild(listEl); wrap.appendChild(gridEl); wrap.appendChild(statsEl);
        container.appendChild(wrap); build();
      },
      destroy(){}
    };
  }

  function createArcadeGame() {
    let canvas, ctx, raf, lastT, state;
    const input = { left:false, right:false, boost:false };
    const W=360,H=540;
    function reset(){state={px:W/2,py:H*0.78,pw:24,ph:18,base:360,obs:[],spawnT:0,score:0,over:false,flash:0};}
    function step(dt){
      if(state.over)return;
      const mv=(input.left?-1:0)+(input.right?1:0);
      const boost=input.boost?1.6:1;
      state.px+=mv*state.base*boost*dt;
      state.px=Math.max(10,Math.min(W-10,state.px));
      state.spawnT+=dt;
      const every=Math.max(0.22,0.7-state.score*0.002);
      if(state.spawnT>=every){state.spawnT=0;state.obs.push({x:randInt(30,W-30),y:-20,r:randInt(14,24),v:randInt(160,240)+state.score*0.25});}
      for(let i=state.obs.length-1;i>=0;i--){const o=state.obs[i];o.y+=o.v*dt;if(o.y>H+40){state.obs.splice(i,1);continue;}
        if(state.px-state.pw/2<o.x+o.r&&state.px+state.pw/2>o.x-o.r&&state.py-state.ph/2<o.y+o.r&&state.py+state.ph/2>o.y-o.r){state.over=true;state.flash=0.2;}}
      state.score+=dt*18; if(state.flash>0)state.flash-=dt;
    }
    function render(){
      ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#fff';ctx.globalAlpha=0.08;for(let y=0;y<H;y+=24)ctx.fillRect(0,y,W,1);ctx.globalAlpha=1;
      if(state.flash>0&&state.over)ctx.globalAlpha=0.2+0.8*Math.abs(Math.sin(performance.now()/50));
      ctx.fillRect(state.px-state.pw/2,state.py-state.ph/2,state.pw,state.ph);ctx.globalAlpha=1;
      ctx.fillStyle='#fff';for(const o of state.obs){ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.fill();}
      ctx.font='16px system-ui';ctx.fillText('SCORE '+(state.score|0),12,24);
      if(state.over){ctx.font='24px system-ui';ctx.fillText('GAME OVER',60,H/2-8);ctx.font='14px system-ui';ctx.fillText('Toca para reiniciar',90,H/2+26);}
    }
    function loop(now){const dt=Math.min(0.033,(now-lastT)/1000);lastT=now;step(dt);render();raf=requestAnimationFrame(loop);}
    function onPointer(e){const rect=canvas.getBoundingClientRect();const x=(e.clientX-rect.left)/rect.width*W;
      if(e.type==='pointerdown'){if(state.over){reset();return;}if(x<W/3)input.left=true;else if(x>2*W/3)input.right=true;else input.boost=true;}
      else{input.left=input.right=input.boost=false;}}
    function onKey(e){if(e.key==='ArrowLeft')input.left=e.type==='keydown';if(e.key==='ArrowRight')input.right=e.type==='keydown';if(e.key===' '&&e.type==='keydown')input.boost=true;if(e.key===' '&&e.type==='keyup')input.boost=false;}
    return {id:'arcade',title:'Arcade',
      mount(container){container.innerHTML='';canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;canvas.style.cssText='max-width:100%;max-height:100%;';container.appendChild(canvas);ctx=canvas.getContext('2d');
        canvas.addEventListener('pointerdown',onPointer);canvas.addEventListener('pointerup',onPointer);canvas.addEventListener('pointercancel',onPointer);
        window.addEventListener('keydown',onKey);window.addEventListener('keyup',onKey);reset();lastT=performance.now();raf=requestAnimationFrame(loop);},
      destroy(){cancelAnimationFrame(raf);window.removeEventListener('keydown',onKey);window.removeEventListener('keyup',onKey);}
    };
  }

  function createTetrisGame() {
    let canvas, ctx, raf, lastT, state, input;
    const COLS=10,ROWS=20,CELL=18,OX=60,OY=90,W=360,H=540;
    const SHAPES=[[[0,1],[1,1],[2,1],[3,1]],[[1,0],[2,0],[1,1],[2,1]],[[1,0],[0,1],[1,1],[2,1]],[[1,0],[2,0],[0,1],[1,1]],[[0,0],[1,0],[1,1],[2,1]],[[0,0],[0,1],[1,1],[2,1]],[[2,0],[0,1],[1,1],[2,1]]];
    function rotated(blocks,rot){const xs=blocks.map(b=>b[0]),ys=blocks.map(b=>b[1]);const px=(Math.min(...xs)+Math.max(...xs))/2,py=(Math.min(...ys)+Math.max(...ys))/2;return blocks.map(([x,y])=>{const dx=x-px,dy=y-py;let nx,ny;if(rot===0){nx=x;ny=y;}else if(rot===1){nx=px-dy;ny=py+dx;}else if(rot===2){nx=px-dx;ny=py-dy;}else{nx=px+dy;ny=py-dx;}return [Math.round(nx),Math.round(ny)];});}
    function collides(x,y,blocks,rot){for(const[bx,by]of rotated(blocks,rot)){const gx=x+bx,gy=y+by;if(gx<0||gx>=COLS||gy>=ROWS)return true;if(gy>=0&&state.grid[gy][gx])return true;}return false;}
    function spawn(){const s=SHAPES[randInt(0,SHAPES.length-1)];state.cur={blocks:s.map(b=>[...b]),x:(COLS/2|0)-2,y:-1,rot:0};if(collides(state.cur.x,state.cur.y,state.cur.blocks,state.cur.rot))state.over=true;}
    function reset(){state={grid:Array.from({length:ROWS},()=>Array(COLS).fill(0)),cur:null,over:false,score:0,lines:0,dropT:0,dropEvery:0.55,lockDelay:0,lockMax:0.25,moveCd:0};spawn();}
    function clearLines(){let cleared=0;for(let y=ROWS-1;y>=0;y--){if(state.grid[y].every(v=>v)){state.grid.splice(y,1);state.grid.unshift(Array(COLS).fill(0));cleared++;y++;}}if(cleared){state.lines+=cleared;state.score+=({1:100,2:300,3:500,4:800})[cleared]||cleared*100;}}
    function lock(){for(const[bx,by]of rotated(state.cur.blocks,state.cur.rot)){const gx=state.cur.x+bx,gy=state.cur.y+by;if(gy>=0&&gy<ROWS&&gx>=0&&gx<COLS)state.grid[gy][gx]=1;}clearLines();spawn();state.lockDelay=0;}
    function step(dt){
      if(state.over)return;
      state.moveCd-=dt;
      if(state.moveCd<=0){if(input.left)state.cur.x-=1,state.moveCd=0.12;else if(input.right)state.cur.x+=1,state.moveCd=0.12;if(input.left||input.right){if(collides(state.cur.x,state.cur.y,state.cur.blocks,state.cur.rot))state.cur.x+=input.left?1:-1;}}
      if(input.rotate){const nr=(state.cur.rot+1)%4;const kicks=[[0,0],[-1,0],[1,0],[-2,0],[2,0],[0,-1]];for(const[kx,ky]of kicks){if(!collides(state.cur.x+kx,state.cur.y+ky,state.cur.blocks,nr)){state.cur.rot=nr;state.cur.x+=kx;state.cur.y+=ky;break;}}input.rotate=false;}
      state.dropT+=dt;
      if(state.dropT>=state.dropEvery){state.dropT=0;if(!collides(state.cur.x,state.cur.y+1,state.cur.blocks,state.cur.rot)){state.cur.y+=1;state.lockDelay=0;}else{state.lockDelay+=state.dropEvery;if(state.lockDelay>=state.lockMax)lock();}}
    }
    function render(){
      ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.fillRect(OX-2,OY-2,COLS*CELL+4,ROWS*CELL+4);ctx.fillStyle='#000';ctx.fillRect(OX,OY,COLS*CELL,ROWS*CELL);
      ctx.fillStyle='#fff';ctx.globalAlpha=0.14;for(let y=0;y<=ROWS;y++)ctx.fillRect(OX,OY+y*CELL,COLS*CELL,1);for(let x=0;x<=COLS;x++)ctx.fillRect(OX+x*CELL,OY,1,ROWS*CELL);ctx.globalAlpha=1;
      for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(state.grid[y][x])ctx.fillRect(OX+x*CELL,OY+y*CELL,CELL,CELL);
      if(!state.over&&state.cur){for(const[bx,by]of rotated(state.cur.blocks,state.cur.rot)){const gx=state.cur.x+bx,gy=state.cur.y+by;if(gy>=0)ctx.fillRect(OX+gx*CELL,OY+gy*CELL,CELL,CELL);}}
      ctx.fillStyle='#fff';ctx.font='16px system-ui';ctx.fillText('SCORE '+state.score,12,24);ctx.fillText('LINES '+state.lines,12,44);
      if(state.over){ctx.font='24px system-ui';ctx.fillText('GAME OVER',60,H/2-8);ctx.font='14px system-ui';ctx.fillText('Toca para reiniciar',90,H/2+26);}
    }
    function loop(now){const dt=Math.min(0.033,(now-lastT)/1000);lastT=now;step(dt);render();raf=requestAnimationFrame(loop);}
    function onPointer(e){const rect=canvas.getBoundingClientRect();const x=(e.clientX-rect.left)/rect.width*W;
      if(e.type==='pointerdown'){if(state.over){reset();return;}if(x<W/3)input.left=true;else if(x>2*W/3)input.right=true;else input.rotate=true;}
      else{input.left=input.right=false;}}
    function onKey(e){if(e.key==='ArrowLeft')input.left=e.type==='keydown';if(e.key==='ArrowRight')input.right=e.type==='keydown';if(e.key==='ArrowUp'&&e.type==='keydown')input.rotate=true;}
    return {id:'tetris',title:'Tetris',
      mount(container){container.innerHTML='';canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;canvas.style.cssText='max-width:100%;max-height:100%;';container.appendChild(canvas);ctx=canvas.getContext('2d');input={left:false,right:false,rotate:false};
        canvas.addEventListener('pointerdown',onPointer);canvas.addEventListener('pointerup',onPointer);canvas.addEventListener('pointercancel',onPointer);
        window.addEventListener('keydown',onKey);window.addEventListener('keyup',onKey);reset();lastT=performance.now();raf=requestAnimationFrame(loop);},
      destroy(){cancelAnimationFrame(raf);window.removeEventListener('keydown',onKey);window.removeEventListener('keyup',onKey);}
    };
  }

  function createRaceGame() {
    let canvas, ctx, raf, lastT, state, input;
    const W=360,H=540,LANES=5,LW=72;
    function drawF1(x,y,flash){if(flash)ctx.globalAlpha=0.2+0.8*Math.abs(Math.sin(performance.now()/50));const s=1.2;ctx.fillStyle='#fff';
      ctx.fillRect(x-14*s,y-22*s,28*s,3*s);ctx.fillRect(x-6*s,y-19*s,12*s,5*s);ctx.fillRect(x-17*s,y-14*s,7*s,8*s);ctx.fillRect(x+10*s,y-14*s,7*s,8*s);
      ctx.fillRect(x-10*s,y-12*s,20*s,12*s);ctx.fillStyle='#000';ctx.fillRect(x-6*s,y-10*s,12*s,6*s);ctx.fillStyle='#fff';
      ctx.fillRect(x-8*s,y,16*s,14*s);ctx.fillRect(x-19*s,y+10*s,9*s,10*s);ctx.fillRect(x+10*s,y+10*s,9*s,10*s);ctx.fillRect(x-18*s,y+23*s,36*s,3*s);ctx.globalAlpha=1;}
    function drawSports(x,y){ctx.fillStyle='#fff';ctx.fillRect(x-14,y-16,28,32);ctx.fillStyle='#000';ctx.fillRect(x-8,y-10,16,12);ctx.fillStyle='#fff';
      ctx.fillRect(x-16,y-12,4,6);ctx.fillRect(x+12,y-12,4,6);ctx.fillRect(x-16,y+6,4,6);ctx.fillRect(x+12,y+6,4,6);ctx.fillRect(x-12,y+16,24,2);}
    function drawCompact(x,y){ctx.fillStyle='#fff';ctx.fillRect(x-12,y-12,24,24);ctx.fillStyle='#000';ctx.fillRect(x-7,y-8,14,8);ctx.fillStyle='#fff';
      ctx.fillRect(x-14,y-8,3,5);ctx.fillRect(x+11,y-8,3,5);ctx.fillRect(x-14,y+3,3,5);ctx.fillRect(x+11,y+3,3,5);}
    function drawSUV(x,y){ctx.fillStyle='#fff';ctx.fillRect(x-16,y-14,32,28);ctx.fillStyle='#000';ctx.fillRect(x-10,y-9,20,10);ctx.fillStyle='#fff';
      ctx.fillRect(x-18,y-10,4,7);ctx.fillRect(x+14,y-10,4,7);ctx.fillRect(x-18,y+3,4,7);ctx.fillRect(x+14,y+3,4,7);}
    function drawEnemy(t,x,y){if(t==='sports')drawSports(x,y);else if(t==='compact')drawCompact(x,y);else drawSUV(x,y);}
    function reset(){state={lane:2,score:0,speed:150,over:false,obs:[],spawnT:0,spawnEvery:0.6,moveCd:0,flash:0};}
    function step(dt){
      if(state.over)return;
      state.moveCd-=dt;
      if(state.moveCd<=0){if(input.left&&state.lane>0){state.lane--;state.moveCd=0.12;}if(input.right&&state.lane<LANES-1){state.lane++;state.moveCd=0.12;}}
      const boost=input.boost?1.8:1;const spd=state.speed*boost;
      state.spawnT+=dt;
      if(state.spawnT>=state.spawnEvery){state.spawnT=0;let lane=randInt(0,LANES-1);if(Math.random()<0.5&&lane===state.lane){if(lane>0)lane--;else if(lane<LANES-1)lane++;}state.obs.push({lane,y:-30,type:['sports','compact','suv'][randInt(0,2)]});}
      const px=state.lane*LW+LW/2,py=H-50;
      for(let i=state.obs.length-1;i>=0;i--){const o=state.obs[i];o.y+=spd*dt;if(o.y>H+30){state.obs.splice(i,1);continue;}const ox=o.lane*LW+LW/2;if(Math.abs(px-ox)<22&&Math.abs(py-o.y)<28){state.over=true;state.flash=0.2;}}
      state.score+=dt*15*boost; if(state.flash>0)state.flash-=dt;
    }
    function render(){
      ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
      for(let i=0;i<LANES;i++){ctx.fillStyle='#fff';ctx.globalAlpha=i%2===0?0.06:0.03;ctx.fillRect(i*LW,0,LW,H);ctx.globalAlpha=1;
        if(i>0){ctx.globalAlpha=0.15;for(let y=0;y<H;y+=30)ctx.fillRect(i*LW-1,y,1,15);ctx.globalAlpha=1;}}
      for(const o of state.obs)drawEnemy(o.type,o.lane*LW+LW/2,o.y);
      const px=state.lane*LW+LW/2,py=H-50;
      drawF1(px,py,state.over&&state.flash>0);
      ctx.fillStyle='#fff';ctx.font='16px system-ui';ctx.fillText('PUNTOS '+(state.score|0),12,24);ctx.fillText('km/h '+(state.speed*3.6|0),12,44);
      if(state.over){ctx.font='24px system-ui';ctx.fillText('GAME OVER',60,H/2-8);ctx.font='14px system-ui';ctx.fillText('Toca para reiniciar',90,H/2+26);}
    }
    function loop(now){const dt=Math.min(0.033,(now-lastT)/1000);lastT=now;step(dt);render();raf=requestAnimationFrame(loop);}
    function onPointer(e){const rect=canvas.getBoundingClientRect();const x=(e.clientX-rect.left)/rect.width*W;
      if(e.type==='pointerdown'){if(state.over){reset();return;}if(x<W/3)input.left=true;else if(x>2*W/3)input.right=true;else input.boost=true;}
      else{input.left=input.right=input.boost=false;}}
    function onKey(e){if(e.key==='ArrowLeft')input.left=e.type==='keydown';if(e.key==='ArrowRight')input.right=e.type==='keydown';if(e.key===' '&&e.type==='keydown')input.boost=true;if(e.key===' '&&e.type==='keyup')input.boost=false;}
    return {id:'race',title:'F1',
      mount(container){container.innerHTML='';canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;canvas.style.cssText='max-width:100%;max-height:100%;';container.appendChild(canvas);ctx=canvas.getContext('2d');input={left:false,right:false,boost:false};
        canvas.addEventListener('pointerdown',onPointer);canvas.addEventListener('pointerup',onPointer);canvas.addEventListener('pointercancel',onPointer);
        window.addEventListener('keydown',onKey);window.addEventListener('keyup',onKey);reset();lastT=performance.now();raf=requestAnimationFrame(loop);},
      destroy(){cancelAnimationFrame(raf);window.removeEventListener('keydown',onKey);window.removeEventListener('keyup',onKey);}
    };
  }

  const GAMES = { sopa:createSopa, arcade:createArcadeGame, tetris:createTetrisGame, race:createRaceGame };

  // =======================================================================
  // CONTROL DE RONDA
  // =======================================================================
  function startGame(id) {
    if (current) { current.cleanup(); current = null; }
    const factory = GAMES[id];
    if (!factory) return;
    const game = factory();
    playTitle.textContent = game.title;
    game.mount(stage);
    current = { id, cleanup: () => game.destroy && game.destroy() };

    selectorView.style.display = 'none';
    playView.classList.add('active');
    overlay.classList.remove('show');
    // Duración = min(tiempo disponible, 120)
    remaining = Math.min(availableTime, MAX_SECONDS);
    paused = false;
    timerEl.textContent = fmtTime(remaining);
    timerEl.classList.remove('warn');
    clearInterval(timerId);
    timerId = setInterval(() => {
      if (paused) return;
      remaining--;
      timerEl.textContent = fmtTime(remaining);
      if (remaining <= 10) timerEl.classList.add('warn');
      if (remaining <= 0) endRound();
    }, 1000);
  }

  function endRound() {
    clearInterval(timerId);
    timerId = null;
    paused = true;
    ovTitle.textContent = '¡Ronda terminada!';
    ovMsg.textContent = 'Volviendo al selector…';
    overlay.classList.add('show');
    setTimeout(() => {
      if (overlay.classList.contains('show')) backToSelector();
    }, 2000);
  }

  function backToSelector() {
    overlay.classList.remove('show');
    clearInterval(timerId); timerId = null;
    if (current) { current.cleanup(); current = null; }
    playView.classList.remove('active');
    stage.innerHTML = '';
    selectorView.style.display = 'flex';
    paused = false;
    renderCards();
  }

  // =======================================================================
  // EVENTOS
  // =======================================================================
  $('#btnBack').addEventListener('click', endRound);
  $('#ovBtn').addEventListener('click', backToSelector);

  // =======================================================================
  // INICIO
  // =======================================================================
  setAvailableTime(120);
})();
</script>
</body>
